plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

kotlin {
    jvmToolchain(17)
}

android {
    namespace "com.simplayer.owncompany"
    compileSdk 34

    defaultConfig {
        applicationId "com.simplayer.owncompany"
        minSdk 21
        targetSdk 34
        versionCode 17
        versionName "1.7"
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            pickFirsts += 'META-INF/beans.xml'
        }
    }
}

dependencies {
    // Core Android libraries
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.constraintlayout:constraintlayout:2.2.0"
    implementation "androidx.cardview:cardview:1.0.0"

    // Media3 ExoPlayer
    implementation "androidx.media3:media3-exoplayer:1.3.1"
    implementation "androidx.media3:media3-ui:1.3.1"

    // Kotlin Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    // DLNA / UPnP (Cling)
    implementation "org.fourthline.cling:cling-core:2.1.2"
    implementation "org.fourthline.cling:cling-support:2.1.2"
}
